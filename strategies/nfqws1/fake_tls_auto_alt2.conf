# =============================================================================
# fake_tls_auto_alt2.conf — Flowseal 1.10.2 / NFQWS первого поколения
# Блоки настроек оформлены по образцу NFQWS2. Синтаксис движка: NFQWS v1.
# =============================================================================

# Интерфейс провайдера: укажите свой.
ISP_INTERFACE="eth3"

# HTTP(S) strategy
NFQWS_ARGS="--filter-tcp=80,443 \
            --dpi-desync=fake,multisplit \
            --dpi-desync-split-seqovl=681 \
            --dpi-desync-split-pos=1 \
            --dpi-desync-fooling=badseq \
            --dpi-desync-badseq-increment=10000000 \
            --dpi-desync-repeats=8 \
            --dpi-desync-split-seqovl-pattern=/opt/etc/nfqws/blobs/tls_clienthello_www_google_com.bin \
            --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com \
            --dpi-desync-fake-http=/opt/etc/nfqws/blobs/tls_clienthello_max_ru.bin"

# QUIC strategy
NFQWS_ARGS_QUIC="--filter-udp=443 \
                 --dpi-desync=fake \
                 --dpi-desync-repeats=11 \
                 --dpi-desync-fake-quic=/opt/etc/nfqws/blobs/quic_initial_www_google_com.bin"

# UDP strategy — Discord / STUN
NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100 \
                --filter-l7=discord,stun \
                --dpi-desync=fake \
                --dpi-desync-fake-discord=/opt/etc/nfqws/blobs/ACTIVE_DISCORD_UDP.bin \
                --dpi-desync-fake-stun=/opt/etc/nfqws/blobs/ACTIVE_DISCORD_UDP.bin \
                --dpi-desync-repeats=6"

# Working modes
MODE_LIST="--hostlist=/opt/etc/nfqws/lists/user.list \
           --hostlist=/opt/etc/nfqws/lists/user-extra.list \
           --hostlist-exclude=/opt/etc/nfqws/lists/exclude.list \
           --hostlist-exclude=/opt/etc/nfqws/lists/exclude-extra.list \
           --ipset-exclude=/opt/etc/nfqws/lists/ipset_exclude.list \
           --ipset-exclude=/opt/etc/nfqws/lists/ipset_exclude-extra.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws/lists/exclude.list \
          --hostlist-exclude=/opt/etc/nfqws/lists/exclude-extra.list \
          --ipset-exclude=/opt/etc/nfqws/lists/ipset_exclude.list \
          --ipset-exclude=/opt/etc/nfqws/lists/ipset_exclude-extra.list"
MODE_AUTO="$MODE_LIST \
           --hostlist-auto=/opt/etc/nfqws/lists/auto.list \
           --hostlist-auto-debug=/opt/var/log/nfqws.log"
NFQWS_EXTRA_ARGS="$MODE_LIST"

# IP-lists
# Общие IP-списки для точных IP-профилей ниже.
FLOWSEAL_IPSET_ARGS="--ipset=/opt/etc/nfqws/lists/ipset.list \
                     --ipset-exclude=/opt/etc/nfqws/lists/ipset_exclude.list \
                     --ipset-exclude=/opt/etc/nfqws/lists/ipset_exclude-extra.list"
# Автокопирование основной стратегии на IP отключено: отдельные
# IP-профили сохраняют исходные порты, исключения и параметры ALT7/ALT9.
NFQWS_ARGS_IPSET=""

# Custom arguments — специальные домены и отдельные IP-профили.
# Служба применяет CUSTOM раньше UDP / QUIC / HTTP(S).
# Исключения user.list/user-extra.list в IP TCP сохраняют приоритет
# основной HTTP(S)-стратегии для этих доменов.
NFQWS_ARGS_CUSTOM="--filter-tcp=2053,2083,2087,2096,8443 \
                   --hostlist-domains=discord.media \
                   --dpi-desync=fake,multisplit \
                   --dpi-desync-split-seqovl=681 \
                   --dpi-desync-split-pos=1 \
                   --dpi-desync-fooling=badseq \
                   --dpi-desync-badseq-increment=10000000 \
                   --dpi-desync-repeats=8 \
                   --dpi-desync-split-seqovl-pattern=/opt/etc/nfqws/blobs/tls_clienthello_www_google_com.bin \
                   --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com \
                   --new \
                   --filter-tcp=443 \
                   --hostlist=/opt/etc/nfqws/lists/google.list \
                   --ip-id=zero \
                   --dpi-desync=fake,multisplit \
                   --dpi-desync-split-seqovl=681 \
                   --dpi-desync-split-pos=1 \
                   --dpi-desync-fooling=badseq \
                   --dpi-desync-badseq-increment=10000000 \
                   --dpi-desync-repeats=8 \
                   --dpi-desync-split-seqovl-pattern=/opt/etc/nfqws/blobs/tls_clienthello_www_google_com.bin \
                   --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com \
                   --new \
                   --filter-udp=443 \
                   --hostlist-exclude=/opt/etc/nfqws/lists/exclude.list \
                   --hostlist-exclude=/opt/etc/nfqws/lists/exclude-extra.list \
                   --dpi-desync=fake \
                   --dpi-desync-repeats=11 \
                   --dpi-desync-fake-quic=/opt/etc/nfqws/blobs/quic_initial_www_google_com.bin \
                   $FLOWSEAL_IPSET_ARGS \
                   --new \
                   --filter-tcp=8443 \
                   --hostlist-exclude=/opt/etc/nfqws/lists/exclude.list \
                   --hostlist-exclude=/opt/etc/nfqws/lists/exclude-extra.list \
                   --dpi-desync=fake,multisplit \
                   --dpi-desync-split-seqovl=681 \
                   --dpi-desync-split-pos=1 \
                   --dpi-desync-fooling=badseq \
                   --dpi-desync-badseq-increment=10000000 \
                   --dpi-desync-repeats=8 \
                   --dpi-desync-split-seqovl-pattern=/opt/etc/nfqws/blobs/tls_clienthello_www_google_com.bin \
                   --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com \
                   --dpi-desync-fake-http=/opt/etc/nfqws/blobs/tls_clienthello_max_ru.bin \
                   $FLOWSEAL_IPSET_ARGS \
                   --new \
                   --filter-tcp=80,443 \
                   --hostlist-exclude=/opt/etc/nfqws/lists/exclude.list \
                   --hostlist-exclude=/opt/etc/nfqws/lists/exclude-extra.list \
                   --dpi-desync=fake,multisplit \
                   --dpi-desync-split-seqovl=681 \
                   --dpi-desync-split-pos=1 \
                   --dpi-desync-fooling=badseq \
                   --dpi-desync-badseq-increment=10000000 \
                   --dpi-desync-repeats=8 \
                   --dpi-desync-split-seqovl-pattern=/opt/etc/nfqws/blobs/tls_clienthello_www_google_com.bin \
                   --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com \
                   --dpi-desync-fake-http=/opt/etc/nfqws/blobs/tls_clienthello_max_ru.bin \
                   $FLOWSEAL_IPSET_ARGS \
                   --hostlist-exclude=/opt/etc/nfqws/lists/user.list \
                   --hostlist-exclude=/opt/etc/nfqws/lists/user-extra.list"

# Game Filter выключен, как в предоставленном порте NFQWS1.

# Настройки службы из исходного конфигурационного файла.
IPV6_ENABLED=1
TCP_PORTS=80,443,2053,2083,2087,2096,8443
UDP_PORTS=443,19294:19344,50000:50100
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
NFQUEUE_NUM=200
USER=nobody
CONFIG_VERSION=8
