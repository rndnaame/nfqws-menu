# =============================================================================
#  general (ALT13).bat  ->  nfqws2
#  Порт стратегии zapret-discord-youtube 1.10.2 (winws1) на nfqws2
#  Блобы взять из bin\\ бандла и положить в /opt/etc/nfqws2/blobs/
# =============================================================================

ISP_INTERFACE="eth3"

NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua \\
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua \\
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua \\
                 --blob=quic_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin \\
                 --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin \\
                 --blob=tls_sochi:@/opt/etc/nfqws2/blobs/tls_clienthello_sochi_park.bin \\
                 --blob=stun2_fake:@/opt/etc/nfqws2/blobs/stun2.bin \\
                 --blob=discord_udp:@/opt/etc/nfqws2/blobs/ACTIVE_DISCORD_UDP.bin \\
                 --blob=game_udp:@/opt/etc/nfqws2/blobs/ACTIVE_GAME_UDP.bin"

# HTTP(S): fake + hostfakesplit, fooling=ts. altorder=1 отсутствует в nfqws2.
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls \\
            --payload=tls_client_hello \\
            --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up \\
            --lua-desync=fake:blob=stun2_fake:repeats=5:tcp_ts=-600000:tcp_ts_up \\
            --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up \\
            --payload=http_req \\
            --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up \\
            --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic --payload=quic_initial \\
                 --lua-desync=fake:blob=quic_google:repeats=11"

NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun \\
                --payload=discord_ip_discovery,stun \\
                --lua-desync=fake:blob=discord_udp:repeats=5"

MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_LIST"
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

NFQWS_ARGS_CUSTOM="
               --filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls \\
               --hostlist-domains=discord.media --payload=tls_client_hello \\
               --lua-desync=fake:blob=tls_google:repeats=7:tcp_ts=-600000:tcp_ts_up \\
               --lua-desync=multisplit:pos=1:seqovl=681:seqovl_pattern=tls_google \\
               --new \\
               --filter-tcp=443 --filter-l7=tls --hostlist=/opt/etc/nfqws2/lists/google.list \\
               --payload=tls_client_hello \\
               --lua-desync=hostfakesplit:host=www.google.com:tcp_ts=-600000:tcp_ts_up
               "

# GAME FILTER в оригинале включается отдельно. При необходимости допишите в
# NFQWS_ARGS_CUSTOM, исключив уже занятые диапазоны портов.
# TCP: fake(tls_sochi + stun2) + hostfakesplit(mail.ru), repeats=5, cutoff n4, ts
# UDP: fake(game_udp), repeats=10, cutoff n4, any-protocol

IPV6_ENABLED=1
TCP_PORTS=80,443,2053,2083,2087,2096,8443
UDP_PORTS=443,19294:19344,50000:50100
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1

# ПРИМЕЧАНИЯ:
# --dpi-desync-fooling=ts -> tcp_ts=-600000 + tcp_ts_up.
# --dpi-desync-hostfakesplit-mod=altorder=1 не имеет прямого аналога в nfqws2;
# используется нативный hostfakesplit с фиксированным порядком.
# Два --dpi-desync-fake-tls в winws выражены двумя fake-инстансами для TLS.
