# =============================================================================
#  general (FAKE TLS AUTO).bat  ->  nfqws2
#  Порт стратегии zapret-discord-youtube 1.10.2 (winws1) на nfqws2
#  Блобы взять из bin\ бандла и положить в /opt/etc/nfqws2/blobs/
# =============================================================================

# Provider network interface, e.g. eth3
ISP_INTERFACE="eth3"

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua \
                 --blob=quic_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin \
                 --blob=tls_max:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin \
                 --blob=discord_udp:@/opt/etc/nfqws2/blobs/ACTIVE_DISCORD_UDP.bin \
                 --blob=game_udp:@/opt/etc/nfqws2/blobs/ACTIVE_GAME_UDP.bin"

# HTTP(S) strategy  <- профиль --filter-tcp=80,443 из .bat
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls \
            --payload=tls_client_hello \
            --lua-desync=fake:blob=0x00000000:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
            --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
            --lua-desync=multidisorder:pos=1,midsld \
            --payload=http_req \
            --lua-desync=fake:blob=tls_max:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
            --lua-desync=multidisorder:pos=1,midsld"

# QUIC strategy  <- профиль --filter-udp=443 из .bat
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic \
                 --payload=quic_initial \
                 --lua-desync=fake:blob=quic_google:repeats=11"

# UDP strategy  <- профиль Discord voice / STUN из .bat
NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun \
                --payload=discord_ip_discovery,stun \
                --lua-desync=fake:blob=discord_udp:repeats=6"

# Working modes
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_LIST"

# IP-lists
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments
# Профили из NFQWS_ARGS_CUSTOM встают ПЕРВЫМИ (до UDP/QUIC/HTTPS).
NFQWS_ARGS_CUSTOM="
               --filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls \
               --hostlist-domains=discord.media \
               --payload=tls_client_hello \
               --lua-desync=fake:blob=0x00000000:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
               --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
               --lua-desync=multidisorder:pos=1,midsld \
               --new \
               --filter-tcp=443 --filter-l7=tls \
               --hostlist=/opt/etc/nfqws2/lists/google.list \
               --payload=tls_client_hello \
               --lua-desync=fake:blob=0x00000000:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up:ip_id=zero \
               --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up:ip_id=zero \
               --lua-desync=multidisorder:pos=1,midsld:ip_id=zero
               "

# --- GAME FILTER (в .bat включается отдельно, по умолчанию выключен) ----------
# Дописать в конец NFQWS_ARGS_CUSTOM через --new. Диапазоны 1024-65535 разбиты,
# чтобы не перехватить порты профилей discord.media / QUIC / Discord-voice.
#
#              --new \
#              --filter-tcp=1024-2052,2054-2082,2084-2086,2088-2095,2097-8442,8444-65535 \
#              --ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list \
#              --out-range=<n4 --payload=known,unknown \
#              --lua-desync=fake:blob=0x00000000:payload=~empty:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
#              --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:payload=~empty:repeats=11:tcp_seq=-10000:tcp_ack=-66000:tcp_ts_up \
#              --lua-desync=multidisorder:pos=1,midsld:payload=~empty \
#              --new \
#              --filter-udp=1024-19293,19345-49999,50101-65535 \
#              --ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list \
#              --out-range=<n2 --payload=known,unknown \
#              --lua-desync=fake:blob=game_udp:payload=~empty:repeats=10

# 1.10.1: обновление перенесено из свежего Windows-бандла. В Game Filter
# fake-unknown соответствует NFQWS2-селекции unknown; старый порт уже охватывал
# unknown через --payload=known,unknown + payload=~empty, поэтому лишние дубли не добавлены.

# IPv6 support
IPV6_ENABLED=1

# TCP ports for iptables rules
# .bat: --wf-tcp=80,443,2053,2083,2087,2096,8443[,GameFilterTCP]
TCP_PORTS=80,443,2053,2083,2087,2096,8443
# с game filter: TCP_PORTS=80,443,1024:65535

# UDP ports for iptables rules
# .bat: --wf-udp=443,19294-19344,50000-50100[,GameFilterUDP]
UDP_PORTS=443,19294:19344,50000:50100
# с game filter: UDP_PORTS=443,1024:65535

# Keenetic policy name
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1

# ПРИМЕЧАНИЯ ------------------------------------------------------------------
# fooling=badseq в winws1 меняет И seq, И ack: seq += increment,
# ack += -66000 (BADSEQ_ACK_INCREMENT_DEFAULT). Отсюда пара tcp_seq/tcp_ack.
#
# list-google.txt из бандла положить как /opt/etc/nfqws2/lists/google.list
#
# --ip-id=zero (параметр профиля winws1) -> ip_id=zero на каждом инстансе.
#
# --dpi-desync-fake-tls=^! в .bat — это экранированный '!', то есть
# «использовать встроенный фейк». В nfqws2 это blob=fake_default_tls.
#
# ВНИМАНИЕ: multidisorder не работает против серверов на Windows —
# они не перезаписывают буфер сокета перекрывающимся сегментом.
#
