# Provider network interface, e.g. eth3
# general (hardcorp74).conf
# You can specify multiple interfaces separated by space, e.g. ISP_INTERFACE="eth3 nwg1"
ISP_INTERFACE="eth3"

# All arguments here: https://github.com/bol-van/zapret2/blob/master/docs/manual.md

# Startup arguments
NFQWS_BASE_ARGS="--fastpath-workaround=auto
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
                 --blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
                 --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin
                 --blob=tls_clienthello_sochi_park:@/opt/etc/nfqws2/blobs/tls_clienthello_sochi_park.bin
                 --blob=quic_initial_5ka_ru:@/opt/etc/nfqws2/blobs/quic_initial_5ka_ru.bin
                 --blob=stun_fake:@/opt/etc/nfqws2/blobs/stun.bin"

# HTTP(S) strategy
NFQWS_ARGS="--filter-tcp=443,80,1984,5222 --filter-l7=http,tls,mtproto
            --payload=tls_client_hello,mtproto_initial
            --lua-desync=circular:fails=2:time=300:retrans=2:nld=2
            --lua-desync=fake:blob=tls_clienthello_sochi_park:tls_mod=rnd,dupsid:tcp_ts=-1500:badsum:strategy=1
            --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:badsum:tcp_md5:tcp_ts_up:strategy=1
            --lua-desync=multisplit:pos=1,sniext-2:seqovl=1:seqovl_pattern=tls_clienthello_sochi_park:strategy=1
            --lua-desync=fake:blob=stun_fake:repeats=2:tcp_ts=-5000:badsum:tcp_ts_up:strategy=2
            --lua-desync=fake:blob=tls_clienthello_sochi_park:tls_mod=rnd,dupsid:tcp_ts=-5000:badsum:tcp_ts_up:strategy=2
            --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:tcp_ts=-5000:tcp_md5:tcp_ts_up:strategy=2
            --payload=http_req
            --lua-desync=fake:blob=tls_clienthello_sochi_park:repeats=5:tcp_ts=-600000:tcp_ts_up
            --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up"

# QUIC strategy
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_initial_5ka_ru:repeats=6"

# UDP strategy (doesn't use lists from NFQWS_EXTRA_ARGS)
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535
                --filter-l7=wireguard,stun,discord,mtproto,unknown
                --out-range=<n2
                --payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial,unknown
                --lua-desync=fake:blob=quic_initial_5ka_ru:repeats=6"

# Working modes, don't change
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list --hostlist=/opt/etc/nfqws2/lists/user_extra.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"

# $MODE_AUTO - automatically detects blocked resources and adds them to the auto.list
# $MODE_LIST - applies rules only to domains in the user.list
# $MODE_ALL  - applies rules to all traffic except domains from exclude.list
NFQWS_EXTRA_ARGS="$MODE_LIST"

# IP-lists
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset=/opt/etc/nfqws2/lists/ipset_as.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments, e.g. NFQWS_ARGS_CUSTOM="--filter-tcp=80 --dpi-desync=fakedsplit --new --filter-tcp=443 --dpi-desync=fake"
NFQWS_ARGS_CUSTOM="--filter-tcp=443
                   --filter-l7=tls
                   --hostlist-domains=wide-youtube.l.google.com
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_clienthello_sochi_park:tcp_seq=-10000:repeats=6:tls_mod=rnd,dupsid,sni=www.google.com
                   --lua-desync=multidisorder:pos=1,midsld
                   --new
                   --filter-tcp=443
                   --filter-l7=tls
                   --hostlist=/opt/etc/nfqws2/lists/google.list
                   --payload=tls_client_hello
                   --lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1
                   --lua-desync=fake:blob=tls_clienthello_sochi_park:optional:tcp_seq=-10000:tcp_ack=-66000:badsum:tls_mod=rnd,dupsid,sni=rzd.ru:tcp_ts_up:repeats=4
                   --new
                   --filter-tcp=443,80,1984,5222
                   --filter-l7=http,tls,mtproto
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_cdn77.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_clouvider.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_contabo.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_creanova.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_digitalocean.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_frantech.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_hetzner.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_iomart.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_melbicom.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_ovh.list
                   --ipset=/opt/etc/nfqws2/lists/ipset_as_vultr.list
                   --payload=tls_client_hello,mtproto_initial
                   --lua-desync=fake:blob=stun_fake:repeats=2:tcp_ts=-5000:badsum:tcp_ts_up
                   --lua-desync=fake:blob=tls_clienthello_sochi_park:tls_mod=rnd,dupsid:tcp_ts=-5000:badsum:tcp_ts_up
                   --lua-desync=hostfakesplit:host=ozon.ru:repeats=2:midhost=host-2:tcp_ts=-5000:tcp_md5:tcp_ts_up
                   --payload=http_req
                   --lua-desync=fake:blob=stun_fake:repeats=2:tcp_ts=-1500:tcp_md5:tcp_ts_up
                   --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-1500:tcp_ts_up"

# IPv6 support
IPV6_ENABLED=0

# TCP ports for iptables rules
TCP_PORTS=80,443,1984,5222

# UDP ports for iptables rules
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535

# Keenetic policy name
POLICY_NAME="nfqws"
# Policy mode (0 - include, 1 - exclude)
POLICY_EXCLUDE=0

# Syslog logging level (0 - silent, 1 - debug)
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"

NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
