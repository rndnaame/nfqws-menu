# =============================================================================
# general (ALT2).bat -> NFQWS2 / Flowseal 1.10.4
# Формат и настройки службы взяты из пользовательского nfqws2.conf.
# Стратегии без смягчения. Game Filter выключен.
# =============================================================================

# Provider network interface
ISP_INTERFACE="eth3"

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
                 --blob=ACTIVE_DISCORD_UDP:@/opt/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin
                 --blob=ACTIVE_GAME_UDP:@/opt/etc/nfqws2/blobs/quic_initial_4pda_to.bin
                 --blob=legacy_quic:@/opt/etc/nfqws2/blobs/legacy_quic.bin
                 --blob=legacy_zero64:@/opt/etc/nfqws2/blobs/legacy_zero64.bin
                 --blob=quic_initial_www_google_com:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_clienthello_www_google_com:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin"

# HTTP(S) strategy
NFQWS_ARGS="--filter-tcp=80,443
            --filter-l7=http,tls
            --payload=known
            --lua-desync=multisplit:pos=2:seqovl=652:seqovl_pattern=tls_clienthello_www_google_com"

# QUIC strategy
NFQWS_ARGS_QUIC="--filter-udp=443
                 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_initial_www_google_com:repeats=6
                 --payload=discord_ip_discovery
                 --lua-desync=fake:blob=legacy_zero64:repeats=6
                 --payload=stun
                 --lua-desync=fake:blob=legacy_zero64:repeats=6
                 --payload=wireguard_initiation
                 --lua-desync=fake:blob=legacy_zero64:repeats=6
                 --payload=dht
                 --lua-desync=fake:blob=legacy_zero64:repeats=6"

# UDP strategy — Discord voice / STUN
NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100
                --filter-l7=discord,stun
                --payload=quic_initial
                --lua-desync=fake:blob=legacy_quic:repeats=6
                --payload=discord_ip_discovery
                --lua-desync=fake:blob=ACTIVE_DISCORD_UDP:repeats=6
                --payload=stun
                --lua-desync=fake:blob=ACTIVE_DISCORD_UDP:repeats=6
                --payload=wireguard_initiation
                --lua-desync=fake:blob=legacy_zero64:repeats=6
                --payload=dht
                --lua-desync=fake:blob=legacy_zero64:repeats=6"

# Working modes — MODE_ALL сохранён из пользовательского образца.
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list
           --hostlist=/opt/etc/nfqws2/lists/rkn.list
           --hostlist=/opt/etc/nfqws2/lists/user-extra.list
           --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list
           --hostlist-exclude=/opt/etc/nfqws2/lists/exclude-extra.list
           --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list
           --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude-extra.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list
          --hostlist-exclude=/opt/etc/nfqws2/lists/exclude-extra.list
          --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list
          --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude-extra.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_ALL"

# IP-lists
# Точные IP-профили находятся в CUSTOM: у них отдельные порты,
# а в ALT7 отличается сам метод. Автокопирование основной стратегии выключено.
NFQWS_ARGS_IPSET=""

# Custom arguments — служба ставит их раньше UDP / QUIC / HTTPS.
# Сначала специальные профили, затем DNS из образца, затем IP-профили.
NFQWS_ARGS_CUSTOM="--filter-tcp=2053,2083,2087,2096,8443
                   --hostlist-domains=discord.media
                   --payload=known
                   --lua-desync=multisplit:pos=2:seqovl=652:seqovl_pattern=tls_clienthello_www_google_com
                   --new
                   --filter-tcp=443
                   --hostlist=/opt/etc/nfqws2/lists/google.list
                   --payload=known
                   --lua-desync=multisplit:ip_id=zero:pos=2:seqovl=652:seqovl_pattern=tls_clienthello_www_google_com
                   --new
