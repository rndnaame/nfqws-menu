                   --hostlist-exclude=/opt/etc/nfqws2/lists/exclude-extra.list
                   --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list
                   --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude-extra.list
                   --payload=known
                   --lua-desync=multisplit:pos=2:seqovl=652:seqovl_pattern=tls_clienthello_www_google_com
                   --new
                   --hostlist-exclude=/opt/etc/nfqws2/lists/user.list
                   --hostlist-exclude=/opt/etc/nfqws2/lists/user-extra.list
                   --hostlist-exclude=/opt/etc/nfqws2/lists/rkn.list
                   --filter-tcp=80,443
                   --ipset=/opt/etc/nfqws2/lists/ipset.list
                   --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list
                   --hostlist-exclude=/opt/etc/nfqws2/lists/exclude-extra.list
                   --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list
                   --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude-extra.list
                   --payload=known
                   --lua-desync=multisplit:pos=2:seqovl=652:seqovl_pattern=tls_clienthello_www_google_com"

# GAME FILTER выключен. Все игровые стратегии сохранены в game-profiles/.
# Их следует ставить ПОСЛЕ основных профилей в итоговой командной строке.
# Вставка полного диапазона в CUSTOM перехватит часть основных правил.

# IPv6 support
IPV6_ENABLED=0

# TCP ports for iptables rules
# .bat: --wf-tcp=80,443,2053,2083,2087,2096,8443[,GameFilterTCP]
TCP_PORTS=80,443,2053,2083,2087,2096,8443,853
# с game filter: TCP_PORTS=80,443,1024:65535

# UDP ports for iptables rules
# .bat: --wf-udp=443,19294-19344,50000-50100[,GameFilterUDP]
UDP_PORTS=443,19294:19344,50000:50100,853
# с game filter: UDP_PORTS=443,1024:65535

# Keenetic policy name
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
