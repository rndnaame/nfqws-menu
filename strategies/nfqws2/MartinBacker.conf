# Provider network interface, e.g. eth3
# general (MartinBacker)   ->  nfqws2
# You can specify multiple interfaces separated by space, e.g. ISP_INTERFACE="eth3 nwg1"
ISP_INTERFACE="eth3 tun6in4_0"

# All arguments here: https://github.com/bol-van/zapret2/blob/master/docs/manual.md

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
                 --blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
                 --blob=quick_dbank:@/opt/etc/nfqws2/blobs/quic_initial_dbankcloud_ru.bin
                 --blob=quick_yt:@/opt/etc/nfqws2/blobs/quic_my_youtube_initial.bin
                 --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin
                 --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_max:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin
                 --blob=stun:@/opt/etc/nfqws2/blobs/stun.bin"

# HTTP(S) strategy
NFQWS_ARGS="--filter-tcp=443,80,1984,5222 --filter-l7=http,tls,mtproto
            # HTTPS
            --payload=tls_client_hello,mtproto_initial
            --out-range=-s34228
            --in-range=-s5556 --lua-desync=circular:fails=2:time=300:retrans=3:nld=2
            --in-range=x
            # Strategy 1
            --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000:strategy=1
            --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=1
            # Strategy 2
            --lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tls_mod=rnd,dupsid,sni=www.google.com:repeats=2:strategy=2
            --lua-desync=multisplit:pos=1,midsld:strategy=2
            # Strategy 3
            --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=3
            --lua-desync=hostfakesplit:tcp_md5:tcp_ts_up:strategy=3
            # Strategy 4
            --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-1000:strategy=4
            --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=4
            # Strategy 5
            --lua-desync=per_instance_condition:strategy=5
            --lua-desync=fake:blob=tls_clienthello:tcp_ts=-1000:cond=cond_tcp_has_ts:strategy=5
            --lua-desync=fake:blob=tls_clienthello:ip_ttl=7:ip6_ttl=4:cond=cond_tcp_has_ts:cond_neg:strategy=5
            --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=5
            # Strategy 6
            --lua-desync=per_instance_condition:strategy=6
            --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_ts=-1000:cond=cond_tcp_has_ts:strategy=6
            --lua-desync=fake:blob=tls_clienthello:ip_ttl=7:ip6_ttl=4:cond=cond_tcp_has_ts:cond_neg:strategy=6
            --lua-desync=multisplit:pos=1:seqovl=336:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=6
            # Strategy 7
            #--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=web.max.ru:badsum:strategy=7
            --lua-desync=multisplit:pos=1:seqovl=582:seqovl_pattern=stun:strategy=7
            # Strategy 8
            #--lua-desync=multisplit:pos=1,midsld:seqovl=568:seqovl_pattern=stun:strategy=8
            #--lua-desync=multisplit:pos=1,sniext+1:seqovl=582:seqovl_pattern=stun:repeats=2-4:badsum:badseq:md5sig:strategy=8
            #--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-1500:badsum:badseq:md5sig:tcp_md5:repeats=5:strategy=8
            #--lua-desync=hostfakesplit:host=www.google.com:midhost=midsld-2:repeats=4:ip_ttl=2:strategy=8
            # Strategy 9
            #--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=ya.ru:tcp_seq=10000:strategy=9
            #--lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=9
            # Strategy 10
            #--lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1:strategy=10
            #--lua-desync=fake:blob=tls_clienthello:optional:tcp_seq=-10000:tcp_ack=-66000:badsum:tls_mod=rnd,dupsid,sni=rzd.ru:repeats=4:strategy=10
            # HTTP
            --payload=http_req
            --lua-desync=http_methodeol:badsum"

# QUIC strategy
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_initial:repeats=11
                 #--lua-desync=fake:blob=quic_initial:repeats=6"

# UDP strategy (doesn't use lists from NFQWS_EXTRA_ARGS)
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535
                --filter-l7=wireguard,stun,discord,mtproto,unknown
                --out-range=<n2
                --payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial,unknown
                --out-range=-s34228
                --in-range=-s5556 --lua-desync=circular:fails=2:time=300:retrans=3:nld=2
                --in-range=x
                # Strategy 1
                --lua-desync=fake:blob=quic_initial:repeats=6:strategy=1
                # Strategy 2
                --lua-desync=fake:repeats=6:strategy=2"

# Working modes, don't change
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"

# $MODE_AUTO - automatically detects blocked resources and adds them to the auto.list
# $MODE_LIST - applies rules only to domains in the user.list
# $MODE_ALL  - applies rules to all traffic except domains from exclude.list
NFQWS_EXTRA_ARGS="$MODE_AUTO"

# IP-lists
NFQWS_ARGS_IPSET=""
ARGS_BLOCK16="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset=/opt/etc/nfqws2/lists/ipset_amazon.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments, e.g. NFQWS_ARGS_CUSTOM="--filter-tcp=80 --dpi-desync=fakedsplit --new --filter-tcp=443 --dpi-desync=fake"
NFQWS_ARGS_CUSTOM="--hostlist-domains=googlevideo.com
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:ip_id=zero:tcp_ts=-600000:tcp_ts_up
                   --lua-desync=hostfakesplit:host=www.google.com:ip_id=zero:tcp_ts=-600000:tcp_ts_up
                   --new
                   --hostlist-domains=googlevideo.com
                   --filter-udp=443 --filter-l7=quic
                   --payload=quic_initial
                   --lua-desync=fake:blob=quic_initial:repeats=11
                   #--lua-desync=fake:blob=quic_initial:repeats=5
                   #--lua-desync=fake:blob=blob_zero:repeats=2
                   --new
                   --hostlist-domains=mobatek.net
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=fake_default_tls:tcp_md5:tls_mod=rnd,dupsid,padencap:repeats=1
                   --lua-desync=multisplit:pos=2 --payload=empty --out-range=<s1
                   --lua-desync=send:tcp_md5
                   --new
                   --ipset=/opt/etc/nfqws2/lists/ipset_do.list
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=ad.adriver.ru:tcp_ts=-1000
                   --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_max:tcp_ts_up
                   #--lua-desync=multisplit:pos=1,midsld:seqovl=568:seqovl_pattern=stun:tcp_ts_up
                   #--lua-desync=multisplit:pos=1,sniext+1:seqovl=582:seqovl_pattern=stun:repeats=2-4:badsum:badseq:md5sig:tcp_ts_up
                   #--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-1500:badsum:badseq:md5sig:tcp_md5:repeats=5:tcp_ts_up
                   #--lua-desync=hostfakesplit:host=www.google.com:midhost=midsld-2:repeats=4:ip_ttl=2:ip6_ttl=2:tcp_ts_up
                   --new
                   --ipset=/opt/etc/nfqws2/lists/ipset_cf_full.list
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=hcaptcha.com:tcp_ts=-1000
                   --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_max:tcp_ts_up
                   --new
                   $ARGS_BLOCK16 --ipset-ip=0.0.0.0
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=multisplit:pos=1,midsld:seqovl=568:seqovl_pattern=stun:tcp_ts_up
                   --lua-desync=multisplit:pos=1,sniext+1:seqovl=582:seqovl_pattern=stun:repeats=2-4:badsum:badseq:md5sig:tcp_ts_up
                   --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-1500:badsum:badseq:md5sig:tcp_md5:repeats=5:tcp_ts_up
                   --lua-desync=hostfakesplit:host=www.google.com:midhost=midsld-2:repeats=4:ip_ttl=2:ip6_ttl=2:tcp_ts_up
                   --new
                   $ARGS_BLOCK16 --ipset-ip=0.0.0.0
                   --filter-udp=443 --filter-l7=quic
                   --payload=quic_initial
                   --lua-desync=fake:blob=quic_initial:repeats=6
                   --new
                   --ipset=/opt/etc/nfqws2/lists/ipset_ovh.list 
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=hostfakesplit:host=ya.ru:tcp_md5:badsum"

# IPv6 support
IPV6_ENABLED=1

# TCP ports for iptables rules
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443

# UDP ports for iptables rules
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535

# Keenetic policy name
POLICY_NAME="nfqws"
# Policy mode (0 - include, 1 - exclude)
POLICY_EXCLUDE=1

# Syslog logging level (0 - silent, 1 - debug)
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"

NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
